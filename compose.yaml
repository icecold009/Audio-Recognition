services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    environment:
      APP_ENV: "${APP_ENV:-development}"
      PORT: "${PORT:-5000}"
      GUNICORN_WORKERS: "${GUNICORN_WORKERS:-2}"
      GUNICORN_TIMEOUT_SECONDS: "${GUNICORN_TIMEOUT_SECONDS:-45}"
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_SERVICE_ROLE_KEY: "${SUPABASE_SERVICE_ROLE_KEY:-}"
      CLIENT_ID_HMAC_SECRET: "${CLIENT_ID_HMAC_SECRET:-}"
      RAPIDAPI_KEY: "${RAPIDAPI_KEY:-}"
      AUDD_API_TOKEN: "${AUDD_API_TOKEN:-}"
      ACOUSTID_API_KEY: "${ACOUSTID_API_KEY:-}"
      LOCAL_FINGERPRINT_INDEX: "${LOCAL_FINGERPRINT_INDEX:-}"
      MAX_UPLOAD_BYTES: "${MAX_UPLOAD_BYTES:-10485760}"
      MIN_AUDIO_SECONDS: "${MIN_AUDIO_SECONDS:-1}"
      MAX_AUDIO_SECONDS: "${MAX_AUDIO_SECONDS:-30}"
      FFMPEG_TIMEOUT_SECONDS: "${FFMPEG_TIMEOUT_SECONDS:-15}"
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    init: true
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://127.0.0.1:$${PORT}/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
