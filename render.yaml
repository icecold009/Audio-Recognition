services:
  - type: web
    name: audio-recognition
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: CLIENT_ID_HMAC_SECRET
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: AUDD_API_TOKEN
        sync: false
      - key: ACOUSTID_API_KEY
        sync: false
      - key: DAILY_LIMIT
        value: "15"
      - key: MONTHLY_LIMIT
        value: "475"
      - key: COOLDOWN_SECONDS
        value: "30"
      - key: MAX_UPLOAD_BYTES
        value: "10485760"
      - key: MIN_AUDIO_SECONDS
        value: "1"
      - key: MAX_AUDIO_SECONDS
        value: "30"
      - key: FFMPEG_TIMEOUT_SECONDS
        value: "15"
      - key: GUNICORN_WORKERS
        value: "2"
      - key: GUNICORN_TIMEOUT_SECONDS
        value: "45"
